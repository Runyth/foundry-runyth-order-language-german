name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify and build
        run: npm run check
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/runyth-order-language-german-v*.zip
            dist/runyth-order-language-german-source-v*.zip
            dist/runyth-order-language-german-v*-SHA256SUMS.txt
            dist/runyth-order-language-german-v*-build-report.json
            module.json
